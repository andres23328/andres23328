<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Terminal con resumen del perfil">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ffb454"/></linearGradient></defs>
<rect width="900" height="290" rx="16" fill="#0a0e20"/>
<rect x="2" y="2" width="896" height="286" rx="15" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="160 80"><animate attributeName="stroke-dashoffset" from="0" to="-240" dur="4s" repeatCount="indefinite"/></rect>
<path d="M2 50H898" stroke="#283058"/><circle cx="30" cy="26" r="7" fill="#ff6b6b"/><circle cx="54" cy="26" r="7" fill="#ffd166"/><circle cx="78" cy="26" r="7" fill="#3ddc97"/>
