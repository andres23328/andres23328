<text x="40" y="191" font-family="Fira Code,Cascadia Code,Consolas,monospace" font-size="19" fill="#c4b8ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.49;.95;1" dur="12s" repeatCount="indefinite"/>$ ls stack/</text>
