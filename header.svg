<g fill="#ffb454"><circle cx="800" cy="60" r="5"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="900" cy="120" r="5"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="940" cy="150" r="5"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle></g>
<g fill="#3ddc97"><circle cx="700" cy="60" r="5"><animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="740" cy="200" r="5"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite"/></circle></g>
<text x="855" y="205" font-family="Fira Code,Cascadia Code,Consolas,monospace" font-size="70" font-weight="700" fill="#8b7bff" opacity=".18">&lt;/&gt;</text>
<rect x="2" y="2" width="996" height="256" rx="17" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="140 70"><animate attributeName="stroke-dashoffset" from="0" to="-210" dur="3s" repeatCount="indefinite"/></rect>
<text x="60" y="112" font-family="Fira Code,Cascadia Code,Consolas,monospace" font-size="50" font-weight="800" fill="url(#t)">Andrés Felipe Ardila</text>
