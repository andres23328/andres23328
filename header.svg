<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Andrés Felipe Ardila, desarrollador de software">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#c4b8ff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
<pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b7bff" stroke-opacity=".13"/></pattern>
<clipPath id="c"><rect x="0" y="0" width="0" height="260"><animate attributeName="width" values="0;1000;1000;0" keyTimes="0;.5;.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
