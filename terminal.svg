<text x="40" y="270" font-family="Fira Code,Cascadia Code,Consolas,monospace" font-size="19" fill="#3ddc97" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.7;.71;.95;1" dur="12s" repeatCount="indefinite"/>✓ disponible para nuevas oportunidades<tspan fill="#8b7bff"> █<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
